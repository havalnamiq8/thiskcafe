<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thisk Cafe - مێنۆی دیجیتالی</title>
    <style>
        :root {
            --bg-gradient-1: #0a0a0a;
            --bg-gradient-2: #1a1a1a;
            --accent-color: #f39c12;
            --text-color: #ffffff;
            --marquee-bg: #f39c12;
            --marquee-text: #000000;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: linear-gradient(135deg, var(--bg-gradient-1), var(--bg-gradient-2));
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 50px;
        }
        .marquee-container {
            width: 100%;
            background-color: var(--marquee-bg);
            color: var(--marquee-text);
            padding: 10px 0;
            overflow: hidden;
            white-space: nowrap;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .marquee-container marquee { width: 100%; }
        .container { width: 100%; max-width: 480px; padding: 15px; display: flex; flex-direction: column; gap: 20px; }
        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            text-align: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .logo-img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent-color); }
        h1 { font-size: 24px; color: var(--text-color); }
        .subtitle { font-size: 13px; opacity: 0.8; }
        .top-controls { display: flex; gap: 10px; width: 100%; justify-content: space-between; }
        select {
            padding: 8px 12px;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: var(--text-color);
            border: 1px solid rgba(255,255,255,0.2);
            outline: none;
        }
        select option { background: #111; color: #fff; }
        .categories-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
            width: 100%;
        }
        .categories-scroll::-webkit-scrollbar { display: none; }
        .cat-btn {
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: var(--text-color);
            cursor: pointer;
            white-space: nowrap;
            transition: 0.3s;
        }
        .cat-btn.active {
            background: var(--accent-color);
            color: #000;
            font-weight: bold;
        }
        .products-grid { display: flex; flex-direction: column; gap: 15px; width: 100%; }
        .product-card {
            display: flex;
            gap: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 12px;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .product-img { width: 80px; height: 80px; border-radius: 10px; object-fit: cover; }
        .product-info { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        .product-name { font-size: 16px; font-weight: bold; }
        .product-desc { font-size: 12px; opacity: 0.7; }
        .product-price { font-size: 14px; font-weight: bold; color: var(--accent-color); }
        .add-btn {
            padding: 6px 12px;
            background: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .cart-bar {
            position: fixed;
            bottom: 20px;
            width: 90%;
            max-width: 440px;
            background: var(--accent-color);
            color: #000;
            padding: 12px 20px;
            border-radius: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="marquee-container" id="marqueeWrapper">
        <marquee id="marqueeText">بەخێر هاتن بۆ Thisk Cafe - مێنۆی دیجیتالی و سیستەمی پێشکەوتوو</marquee>
    </div>
    <div class="container">
        <header>
            <img id="cafeLogo" src="https://via.placeholder.com/80" alt="Logo" class="logo-img">
            <h1 id="cafeName">Thisk Cafe</h1>
            <p class="subtitle" id="headerSubtitle">مێنۆی دیجیتالی و داواکاری ڕاستەوخۆ</p>
            <div class="top-controls">
                <select id="langSelect" onchange="changeLanguage(this.value)">
                    <option value="ku">کوردی (سۆرانی)</option>
                    <option value="ar">العربية</option>
                    <option value="en">English</option>
                </select>
                <select id="tableSelect">
                    <option value="1">مێزی ١ (Table 1)</option>
                    <option value="2">مێزی ٢ (Table 2)</option>
                    <option value="3">مێزی ٣ (Table 3)</option>
                </select>
            </div>
        </header>
        <div class="categories-scroll" id="categoriesContainer"></div>
        <div class="products-grid" id="productsContainer"></div>
    </div>
    <div class="cart-bar" onclick="openCart()">
        <span id="cartCountText">سەبەتەی کڕین (٠ کالا)</span>
        <span id="cartTotalPrice">٠ IQD</span>
    </div>
    <script>
        function loadSettings() {
            const settings = JSON.parse(localStorage.getItem('thisk_settings')) || {
                name: 'Thisk Cafe',
                logo: 'https://via.placeholder.com/80',
                marqueeText: 'بەخێر هاتن بۆ Thisk Cafe - مێنۆی دیجیتالی و سیستەمی پێشکەوتوو',
                marqueeBg: '#f39c12',
                marqueeTextColor: '#000000',
                bg1: '#0a0a0a',
                bg2: '#1a1a1a',
                accent: '#f39c12'
            };
            document.getElementById('cafeName').innerText = settings.name;
            if(settings.logo) document.getElementById('cafeLogo').src = settings.logo;
            const mq = document.getElementById('marqueeText');
            mq.innerText = settings.marqueeText;
            const mw = document.getElementById('marqueeWrapper');
            mw.style.backgroundColor = settings.marqueeBg;
            mw.style.color = settings.marqueeTextColor;
            document.documentElement.style.setProperty('--bg-gradient-1', settings.bg1);
            document.documentElement.style.setProperty('--bg-gradient-2', settings.bg2);
            document.documentElement.style.setProperty('--accent-color', settings.accent);
        }
        function loadMenu() {
            const categories = JSON.parse(localStorage.getItem('thisk_categories')) || ['خواردنەوە گەرمەکان', 'خواردنەوە ساردەکان', 'پیزا و فاست فۆد'];
            const products = JSON.parse(localStorage.getItem('thisk_products')) || [
                {id: 1, name: 'قاوەی ئەسڵ', category: 'خواردنەوە گەرمەکان', price: 3000, desc: 'قاوەی تایبەتی کافە', img: 'https://via.placeholder.com/80'}
            ];
            const catContainer = document.getElementById('categoriesContainer');
            catContainer.innerHTML = `<button class="cat-btn active" onclick="filterCat('all', this)">هەمووی</button>`;
            categories.forEach(cat => {
                catContainer.innerHTML += `<button class="cat-btn" onclick="filterCat('${cat}', this)">${cat}</button>`;
            });
            renderProducts(products);
        }
        function renderProducts(prods) {
            const prodContainer = document.getElementById('productsContainer');
            prodContainer.innerHTML = '';
            prods.forEach(p => {
                prodContainer.innerHTML += `
                    <div class="product-card">
                        <img src="${p.img || 'https://via.placeholder.com/80'}" class="product-img">
                        <div class="product-info">
                            <div class="product-name">${p.name}</div>
                            <div class="product-desc">${p.desc || ''}</div>
                            <div class="product-price">${p.price} IQD</div>
                        </div>
                        <button class="add-btn" onclick="addToCart('${p.name}', ${p.price})">+</button>
                    </div>
                `;
            });
        }
        let cart = [];
        function addToCart(name, price) {
            cart.push({name, price});
            document.getElementById('cartCountText').innerText = `سەبەتەی کڕین (${cart.length} کالا)`;
            let total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('cartTotalPrice').innerText = total + ' IQD';
        }
        function openCart() {
            if(cart.length === 0) {
                alert('سەبەتەکەت بەتاڵە!');
                return;
            }
            const table = document.getElementById('tableSelect').value;
            let order = {table: table, items: cart, time: new Date().toLocaleTimeString(), total: cart.reduce((sum, item) => sum + item.price, 0)};
            let allOrders = JSON.parse(localStorage.getItem('thisk_orders')) || [];
            allOrders.push(order);
            localStorage.setItem('thisk_orders', JSON.stringify(allOrders));
            alert('داواکارییەکەت بە سەرکەوتوویی نێردرا بۆ مێزی ' + table);
            cart = [];
            document.getElementById('cartCountText').innerText = `سەبەتەی کڕین (٠ کالا)`;
            document.getElementById('cartTotalPrice').innerText = '٠ IQD';
        }
        function changeLanguage(lang) {}
        window.onload = function() {
            loadSettings();
            loadMenu();
        }
    </script>
</body>
</html>
